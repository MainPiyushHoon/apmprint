<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>APM Print Product Mockup Generator</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      background: #ffffff;
    }
    #status {
      margin-top: 15px;
      font-size: 16px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>APM Product Mockup Generator</h1>
  <canvas id="c" width="800" height="500"></canvas>
  <div id="status">Ready</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = 800;
    const H = 500;

    // Palette
    const BRAND = {
      blue: '#008DD2',
      royal: '#1D5FAB',
      orange: '#EF7F1A',
      green: '#B0CB1F',
      magenta: '#E5097F',
      dark: '#1e293b',
      light: '#f8fafc',
      gray: '#94a3b8'
    };

    function drawStudioBackground(title, categoryLabel, badgeText) {
      ctx.save();
      // Floor / Studio backdrop
      const bgGrad = ctx.createRadialGradient(W / 2, H * 0.45, 50, W / 2, H * 0.5, W * 0.7);
      bgGrad.addColorStop(0, '#ffffff');
      bgGrad.addColorStop(0.6, '#f8fafc');
      bgGrad.addColorStop(1, '#e2e8f0');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Subtle ambient vignette
      const vignette = ctx.createLinearGradient(0, 0, 0, H);
      vignette.addColorStop(0, 'rgba(255,255,255,0.8)');
      vignette.addColorStop(0.7, 'rgba(241,245,249,0.3)');
      vignette.addColorStop(1, 'rgba(203,213,225,0.5)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, W, H);

      // Subtle studio ground shadow
      ctx.beginPath();
      ctx.ellipse(W / 2, H * 0.82, W * 0.38, 26, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.08)';
      ctx.filter = 'blur(12px)';
      ctx.fill();
      ctx.filter = 'none';

      // Subtle product label watermark on bottom right
      ctx.font = '600 13px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(148, 163, 184, 0.45)';
      ctx.textAlign = 'right';
      ctx.fillText('APM PRINT MANUFACTURING', W - 28, H - 24);

      ctx.restore();
    }

    // Helper: Rounded Rect
    function roundRect(ctx, x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    const renderers = {
      // 1. Bill Book
      'bill-book': () => {
        drawStudioBackground('Bill Book', 'Stationery', 'Popular');
        ctx.save();
        // Shadow
        ctx.beginPath();
        ctx.ellipse(400, 390, 240, 22, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.filter = 'blur(14px)';
        ctx.fill();
        ctx.filter = 'none';

        // Bottom Book (Pink Copy)
        ctx.save();
        ctx.translate(370, 260);
        ctx.rotate(-0.06);
        roundRect(ctx, -170, -120, 340, 230, 8);
        ctx.fillStyle = '#fce7f3';
        ctx.fill();
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // Pink spine
        roundRect(ctx, -170, -120, 38, 230, 4);
        ctx.fillStyle = '#db2777';
        ctx.fill();
        ctx.restore();

        // Top Book (Original White NCR)
        ctx.save();
        ctx.translate(410, 240);
        ctx.rotate(0.04);
        // Base cover
        roundRect(ctx, -170, -125, 340, 240, 8);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Blue Binding Tape
        roundRect(ctx, -170, -125, 38, 240, 4);
        ctx.fillStyle = '#1D5FAB';
        ctx.fill();
        // Perforation Dotted Line
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.moveTo(-120, -115);
        ctx.lineTo(-120, 105);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.setLineDash([]);

        // Invoice Header
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('TAX INVOICE', -100, -85);
        ctx.fillStyle = '#EF7F1A';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('AGGARWAL PRINT MEDIA', -100, -68);

        // Red Sequential Stamp
        ctx.fillStyle = '#dc2626';
        ctx.font = 'bold 13px monospace';
        ctx.fillText('No. 004821', 45, -85);

        // Invoice Table Lines
        ctx.fillStyle = '#f1f5f9';
        roundRect(ctx, -100, -50, 250, 18, 2);
        ctx.fill();
        ctx.fillStyle = '#475569';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('S.N.   DESCRIPTION           QTY   RATE   AMOUNT', -95, -37);

        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          ctx.moveTo(-100, -15 + i * 20);
          ctx.lineTo(150, -15 + i * 20);
          ctx.stroke();
        }

        // Totals Box
        roundRect(ctx, 40, 80, 110, 26, 4);
        ctx.fillStyle = '#e0f2fe';
        ctx.fill();
        ctx.fillStyle = '#0284c7';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('TOTAL:  Rs. 18,450/-', 46, 97);
        ctx.restore();

        ctx.restore();
      },

      // 2. Challan Book
      'challan-book': () => {
        drawStudioBackground('Challan Book', 'Stationery', 'Essential');
        ctx.save();
        // Ground shadow
        ctx.beginPath();
        ctx.ellipse(400, 395, 230, 20, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.16)';
        ctx.filter = 'blur(12px)';
        ctx.fill();
        ctx.filter = 'none';

        // Triplicate yellow slip underneath
        ctx.save();
        ctx.translate(380, 260);
        ctx.rotate(-0.08);
        roundRect(ctx, -160, -115, 320, 220, 8);
        ctx.fillStyle = '#fef08a';
        ctx.fill();
        ctx.strokeStyle = '#facc15';
        ctx.stroke();
        roundRect(ctx, -160, -115, 35, 220, 4);
        ctx.fillStyle = '#ca8a04';
        ctx.fill();
        ctx.restore();

        // Main Delivery Challan Book
        ctx.save();
        ctx.translate(415, 235);
        ctx.rotate(0.03);
        roundRect(ctx, -165, -120, 330, 230, 8);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Green binding cloth tape
        roundRect(ctx, -165, -120, 38, 230, 4);
        ctx.fillStyle = '#16a34a';
        ctx.fill();

        // Dotted perforation
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.moveTo(-115, -110);
        ctx.lineTo(-115, 100);
        ctx.strokeStyle = '#94a3b8';
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('DELIVERY CHALLAN', -95, -80);
        ctx.fillStyle = '#16a34a';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('GOODS TRANSPORT DISPATCH SLIP', -95, -62);

        ctx.fillStyle = '#dc2626';
        ctx.font = 'bold 13px monospace';
        ctx.fillText('CH-00892', 65, -80);

        // Vehicle details box
        roundRect(ctx, -95, -45, 240, 30, 4);
        ctx.fillStyle = '#f8fafc';
        ctx.fill();
        ctx.strokeStyle = '#e2e8f0';
        ctx.stroke();
        ctx.fillStyle = '#475569';
        ctx.font = '11px sans-serif';
        ctx.fillText('Vehicle No: UP-14-BT-9241    Date: 19/09/2026', -88, -25);

        // Grid lines
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(-95, 5 + i * 22);
          ctx.lineTo(145, 5 + i * 22);
          ctx.strokeStyle = '#e2e8f0';
          ctx.stroke();
        }

        // Signature stamp
        ctx.fillStyle = '#1e3a8a';
        ctx.font = '11px sans-serif';
        ctx.fillText("Receiver's Signature", -90, 95);
        ctx.fillText("Authorized Signatory", 40, 95);
        ctx.restore();

        ctx.restore();
      },

      // 3. Letter Head
      'letter-head': () => {
        drawStudioBackground('Letter Head', 'Stationery', 'Corporate');
        ctx.save();
        // Shadow
        ctx.beginPath();
        ctx.ellipse(390, 400, 210, 20, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.16)';
        ctx.filter = 'blur(14px)';
        ctx.fill();
        ctx.filter = 'none';

        // Secondary sheet angled
        ctx.save();
        ctx.translate(370, 250);
        ctx.rotate(-0.06);
        roundRect(ctx, -140, -180, 280, 350, 4);
        ctx.fillStyle = '#f8fafc';
        ctx.fill();
        ctx.strokeStyle = '#e2e8f0';
        ctx.stroke();
        ctx.restore();

        // Primary A4 Letterhead
        ctx.save();
        ctx.translate(410, 235);
        ctx.rotate(0.02);
        roundRect(ctx, -145, -185, 290, 360, 4);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Header Design (Royal Blue & Gold Ribbon)
        const headerGrad = ctx.createLinearGradient(-145, -185, 145, -185);
        headerGrad.addColorStop(0, '#1D5FAB');
        headerGrad.addColorStop(0.7, '#008DD2');
        headerGrad.addColorStop(1, '#EF7F1A');
        ctx.fillStyle = headerGrad;
        roundRect(ctx, -145, -185, 290, 10, 0);
        ctx.fill();

        // Logo Crest & Brand
        ctx.beginPath();
        ctx.arc(-105, -140, 20, 0, Math.PI*2);
        ctx.fillStyle = '#1D5FAB';
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('A', -111, -134);

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText('AGGARWAL PRINT MEDIA', -75, -145);
        ctx.fillStyle = '#64748b';
        ctx.font = '10px sans-serif';
        ctx.fillText('Sector 12, Vijay Nagar, Ghaziabad | +91 95820 23022', -75, -130);

        // Dividing rule
        ctx.strokeStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.moveTo(-125, -110);
        ctx.lineTo(125, -110);
        ctx.stroke();

        // Watermark in center
        ctx.save();
        ctx.globalAlpha = 0.06;
        ctx.font = 'bold 54px sans-serif';
        ctx.fillStyle = '#1D5FAB';
        ctx.textAlign = 'center';
        ctx.fillText('APM PRINT', 0, 10);
        ctx.restore();

        // Simulated text lines
        ctx.fillStyle = '#cbd5e1';
        for (let i = 0; i < 9; i++) {
          const lw = i === 8 ? 160 : 250;
          roundRect(ctx, -125, -75 + i * 18, lw, 6, 2);
          ctx.fill();
        }

        // Footer band
        ctx.fillStyle = '#1e293b';
        roundRect(ctx, -145, 163, 290, 12, 0);
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '8px sans-serif';
        ctx.fillText('ISO 9001:2015 CERTIFIED COMMERCIAL OFFSET & DIGITAL PRESS', -115, 172);

        // Luxury Executive Pen alongside
        ctx.save();
        ctx.translate(155, 30);
        ctx.rotate(-0.3);
        roundRect(ctx, -4, -90, 8, 180, 4);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        roundRect(ctx, -4, -90, 8, 30, 2);
        ctx.fillStyle = '#e2e8f0';
        ctx.fill();
        ctx.restore();

        ctx.restore();
        ctx.restore();
      },

      // 4. School Office Registers
      'school-registers': () => {
        drawStudioBackground('School Office Registers', 'Stationery', 'Bulk Supply');
        ctx.save();
        // Shadow
        ctx.beginPath();
        ctx.ellipse(400, 395, 240, 22, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.filter = 'blur(14px)';
        ctx.fill();
        ctx.filter = 'none';

        // Stacked bottom register
        ctx.save();
        ctx.translate(380, 270);
        ctx.rotate(-0.05);
        roundRect(ctx, -170, -120, 340, 240, 10);
        ctx.fillStyle = '#831843'; // deep maroon
        ctx.fill();
        roundRect(ctx, -170, -120, 40, 240, 6);
        ctx.fillStyle = '#000000';
        ctx.fill();
        ctx.restore();

        // Main Hardbound Student Register
        ctx.save();
        ctx.translate(415, 235);
        ctx.rotate(0.03);
        roundRect(ctx, -175, -125, 350, 250, 10);
        // Marble cover texture
        const coverGrad = ctx.createLinearGradient(-175, -125, 175, 125);
        coverGrad.addColorStop(0, '#065f46');
        coverGrad.addColorStop(0.5, '#047857');
        coverGrad.addColorStop(1, '#064e3b');
        ctx.fillStyle = coverGrad;
        ctx.fill();

        // Black canvas spine
        roundRect(ctx, -175, -125, 45, 250, 6);
        ctx.fillStyle = '#0f172a';
        ctx.fill();

        // Gold corner protectors
        ctx.fillStyle = '#f59e0b';
        // top-right
        ctx.beginPath();
        ctx.moveTo(175, -125);
        ctx.lineTo(145, -125);
        ctx.lineTo(175, -95);
        ctx.fill();
        // bottom-right
        ctx.beginPath();
        ctx.moveTo(175, 125);
        ctx.lineTo(145, 125);
        ctx.lineTo(175, 95);
        ctx.fill();

        // Central white title label
        roundRect(ctx, -70, -60, 200, 120, 6);
        ctx.fillStyle = '#fffbeb';
        ctx.fill();
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 16px serif';
        ctx.textAlign = 'center';
        ctx.fillText('STUDENT ATTENDANCE', 30, -30);
        ctx.fillText('REGISTER', 30, -10);

        ctx.strokeStyle = '#b45309';
        ctx.beginPath();
        ctx.moveTo(-40, 5);
        ctx.lineTo(100, 5);
        ctx.stroke();

        ctx.fillStyle = '#475569';
        ctx.font = '11px sans-serif';
        ctx.fillText('CLASS: ________  SEC: ____', 30, 24);
        ctx.fillText('SESSION: 2026 - 2027', 30, 42);

        // Gold stamping on spine
        ctx.save();
        ctx.translate(-152, 0);
        ctx.rotate(-Math.PI/2);
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('ATTENDANCE LEDGER 2026', 0, 4);
        ctx.restore();

        ctx.restore();
        ctx.restore();
      },

      // 5. School Office ID Cards
      'school-id-cards': () => {
        drawStudioBackground('School Office ID Cards', 'Stationery', 'PVC & Satin');
        ctx.save();
        // Shadow
        ctx.beginPath();
        ctx.ellipse(400, 400, 220, 20, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.filter = 'blur(14px)';
        ctx.fill();
        ctx.filter = 'none';

        // Satin Lanyard trailing down
        ctx.beginPath();
        ctx.moveTo(400, 0);
        ctx.bezierCurveTo(400, 70, 330, 90, 330, 140);
        ctx.lineWidth = 18;
        ctx.strokeStyle = '#1D5FAB';
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(400, 0);
        ctx.bezierCurveTo(400, 70, 470, 90, 470, 140);
        ctx.lineWidth = 18;
        ctx.strokeStyle = '#1D5FAB';
        ctx.stroke();

        // Metal Swivel Clip
        roundRect(ctx, 388, 130, 24, 28, 4);
        ctx.fillStyle = '#94a3b8';
        ctx.fill();

        // Card 1: Student ID (Front)
        ctx.save();
        ctx.translate(340, 260);
        ctx.rotate(-0.06);
        roundRect(ctx, -95, -135, 190, 270, 10);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Header band
        const c1Grad = ctx.createLinearGradient(-95, -135, 95, -135);
        c1Grad.addColorStop(0, '#1D5FAB');
        c1Grad.addColorStop(1, '#008DD2');
        ctx.fillStyle = c1Grad;
        roundRect(ctx, -95, -135, 190, 50, 0);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('DELHI PUBLIC SCHOOL', 0, -112);
        ctx.font = '9px sans-serif';
        ctx.fillText('STUDENT IDENTITY CARD', 0, -98);

        // Photo slot
        roundRect(ctx, -40, -70, 80, 95, 6);
        ctx.fillStyle = '#e2e8f0';
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.stroke();
        // Silhouette photo
        ctx.beginPath();
        ctx.arc(0, -35, 18, 0, Math.PI*2);
        ctx.fillStyle = '#94a3b8';
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(0, 10, 28, 20, 0, 0, Math.PI);
        ctx.fill();

        // Student Info
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('AARAV SHARMA', 0, 42);
        ctx.fillStyle = '#64748b';
        ctx.font = '10px sans-serif';
        ctx.fillText('Class: X - A | Roll: 24', 0, 58);
        ctx.fillText('Blood Group: O+ve', 0, 72);

        // Barcode
        ctx.fillStyle = '#0f172a';
        for (let i = 0; i < 24; i++) {
          const bw = (i % 3 === 0) ? 3 : 1.5;
          ctx.fillRect(-60 + i * 5, 88, bw, 20);
        }
        ctx.restore();

        // Card 2: Staff / Corporate ID (Back/Tilted)
        ctx.save();
        ctx.translate(470, 280);
        ctx.rotate(0.08);
        roundRect(ctx, -90, -130, 180, 260, 10);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        roundRect(ctx, -90, -130, 180, 45, 0);
        ctx.fillStyle = '#EF7F1A';
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CORPORATE ID PASS', 0, -104);

        roundRect(ctx, -35, -65, 70, 80, 6);
        ctx.fillStyle = '#e2e8f0';
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('PRIYA VERMA', 0, 35);
        ctx.fillStyle = '#64748b';
        ctx.font = '9px sans-serif';
        ctx.fillText('EMP ID: APM-8421', 0, 50);

        // Hologram sticker
        roundRect(ctx, -16, 70, 32, 22, 4);
        const holo = ctx.createLinearGradient(-16, 70, 16, 92);
        holo.addColorStop(0, '#f472b6');
        holo.addColorStop(0.5, '#38bdf8');
        holo.addColorStop(1, '#fbbf24');
        ctx.fillStyle = holo;
        ctx.fill();
        ctx.restore();

        ctx.restore();
      },

      // 6. Office Files
      'office-files': () => {
        drawStudioBackground('Office Files', 'Stationery', 'Heavy Cardboard');
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(400, 395, 240, 20, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.filter = 'blur(14px)';
        ctx.fill();
        ctx.filter = 'none';

        // Pair of cobra clip and box files
        ctx.save();
        ctx.translate(360, 250);
        ctx.rotate(-0.06);
        roundRect(ctx, -150, -140, 300, 280, 8);
        ctx.fillStyle = '#1e3a8a'; // deep royal navy
        ctx.fill();
        // Silver spine metal ring
        ctx.beginPath();
        ctx.arc(-110, 0, 14, 0, Math.PI*2);
        ctx.fillStyle = '#cbd5e1';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-110, 0, 8, 0, Math.PI*2);
        ctx.fillStyle = '#1e3a8a';
        ctx.fill();
        ctx.restore();

        // Top open Cobra file
        ctx.save();
        ctx.translate(430, 240);
        ctx.rotate(0.04);
        roundRect(ctx, -150, -135, 300, 270, 8);
        ctx.fillStyle = '#1d4ed8';
        ctx.fill();
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 2;
        ctx.stroke();

        // White Spine Label insert
        roundRect(ctx, -140, -110, 35, 220, 4);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 11px sans-serif';
        ctx.save();
        ctx.translate(-122, 0);
        ctx.rotate(-Math.PI/2);
        ctx.textAlign = 'center';
        ctx.fillText('FINANCE & GST 2026', 0, 4);
        ctx.restore();

        // Cobra metal clip mechanism
        roundRect(ctx, -80, -90, 200, 25, 4);
        ctx.fillStyle = '#e2e8f0';
        ctx.fill();
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('STAINLESS STEEL SPRING COBRA CLIP', -60, -74);

        // Internal paper stack
        roundRect(ctx, -80, -50, 195, 160, 4);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        for (let i = 0; i < 7; i++) {
          roundRect(ctx, -65, -30 + i * 20, 160, 6, 2);
          ctx.fill();
        }
        ctx.restore();

        ctx.restore();
      },

      // 7. Record Registers
      'record-registers': () => {
        drawStudioBackground('Record Registers', 'Stationery', 'Industrial');
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(400, 395, 240, 20, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.filter = 'blur(14px)';
        ctx.fill();
        ctx.filter = 'none';

        ctx.save();
        ctx.translate(400, 240);
        ctx.rotate(0.02);
        roundRect(ctx, -180, -130, 360, 260, 10);
        ctx.fillStyle = '#78350f'; // rich leather brown
        ctx.fill();

        // Canvas Buckram Spine
        roundRect(ctx, -180, -130, 48, 260, 6);
        ctx.fillStyle = '#451a03';
        ctx.fill();

        // Gold decorative filigree frame
        roundRect(ctx, -115, -110, 280, 220, 6);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 1.5;

        ctx.ellipse(400, 400, 240, 20, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.filter = 'blur(14px)';
        ctx.fill();
        ctx.filter = 'none';

        ctx.save();
        ctx.translate(400, 230);
        // Aluminum Mitered Snap Frame
        roundRect(ctx, -170, -135, 340, 270, 4);
        ctx.fillStyle = '#cbd5e1'; // Anodized silver
        ctx.fill();
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Miter corner joints
        [[-170, -135], [170, -135], [-170, 135], [170, 135]].forEach(([x, y]) => {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x > 0 ? x - 20 : x + 20, y > 0 ? y - 20 : y + 20);
          ctx.strokeStyle = '#64748b';
          ctx.stroke();
        });

        // High-Lumen Illuminated Poster Face
        roundRect(ctx, -145, -112, 290, 224, 2);
        const postGrad = ctx.createLinearGradient(-145, -112, 145, 112);
        postGrad.addColorStop(0, '#0f172a');
        postGrad.addColorStop(1, '#1D5FAB');
        ctx.fillStyle = postGrad;
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ULTRA-SLIM', 0, -40);
        ctx.fillText('CLIP-ON LIGHTBOX', 0, -10);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('EASY POSTER SNAP OPEN & CHANGE', 0, 25);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px sans-serif';
        ctx.fillText('Even Edge-Lit LED Illumination', 0, 55);
        ctx.restore();

        ctx.restore();
      },

      // 31. Sandwich Board
      'sandwich-board': () => {
        drawStudioBackground('Sandwich Board', 'Outdoor & Signage', 'Sidewalk A-Frame');
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(400, 410, 210, 18, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.filter = 'blur(14px)';
        ctx.fill();
        ctx.filter = 'none';

        ctx.save();
        ctx.translate(400, 230);
        // Back leg (depth perspective)
        ctx.save();
        ctx.transform(0.9, 0, -0.15, 1, -25, 0);
        roundRect(ctx, -100, -140, 200, 280, 8);
        ctx.fillStyle = '#475569';
        ctx.fill();
        ctx.restore();

        // Front Face A-Frame
        ctx.save();
        ctx.transform(0.9, 0, 0.12, 1, 25, 0);
        // Wooden/Aluminum Frame
        roundRect(ctx, -105, -145, 210, 290, 8);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Poster / Board Area
        roundRect(ctx, -85, -125, 170, 245, 4);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.fillStyle = '#EF7F1A';
        roundRect(ctx, -85, -125, 170, 60, 0);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SPECIAL OFFER', 0, -90);

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText('DOUBLE SIDED', 0, -25);
        ctx.fillText('A-FRAME BOARD', 0, -5);

        ctx.fillStyle = '#dc2626';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText('VISIT US TODAY', 0, 40);

        ctx.fillStyle = '#64748b';
        ctx.font = '10px sans-serif';
        ctx.fillText('Durable Sidewalk Display', 0, 75);
        ctx.fillText('Pavement Poster Stand', 0, 92);

        ctx.restore();
        ctx.restore();
        ctx.restore();
      },

      // 32. Outdoor Branding & Advertising
      'outdoor-branding': () => {
        drawStudioBackground('Outdoor Branding', 'Outdoor & Signage', 'Large Hoardings');
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(400, 410, 260, 22, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.filter = 'blur(14px)';
        ctx.fill();
        ctx.filter = 'none';

        ctx.save();
        ctx.translate(400, 220);
        // Unipole Steel Pillar
        roundRect(ctx, -16, 80, 32, 110, 4);
        ctx.fillStyle = '#475569';
        ctx.fill();

        // Massive Billboard Display
        roundRect(ctx, -230, -120, 460, 200, 6);
        ctx.fillStyle = '#0f172a';
        ctx.fill();

        // Sky & Cityscape background inside billboard
        const bGrad = ctx.createLinearGradient(-230, -120, 230, 80);
        bGrad.addColorStop(0, '#008DD2');
        bGrad.addColorStop(0.6, '#1D5FAB');
        bGrad.addColorStop(1, '#E5097F');
        roundRect(ctx, -220, -110, 440, 180, 4);
        ctx.fillStyle = bGrad;
        ctx.fill();

        // Overhead Floodlights
        ctx.fillStyle = '#e2e8f0';
        [[-150, -128], [-50, -128], [50, -128], [150, -128]].forEach(([x, y]) => {
          roundRect(ctx, x - 12, y, 24, 10, 2);
          ctx.fill();
        });

        // Billboard Text
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('OUTDOOR HOARDINGS & KIOSKS', 0, -40);

        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('MAXIMUM HIGHWAY & METRO VISIBILITY', 0, -5);

        ctx.fillStyle = '#ffffff';
        ctx.font = '13px sans-serif';
        ctx.fillText('Turnkey Building Wraps | Ghaziabad & Delhi-NCR Campaign Execution', 0, 32);

        ctx.restore();
        ctx.restore();
      }
    };

    // Public API called by Node runner
    window.renderProduct = function(productId) {
      if (renderers[productId]) {
        renderers[productId]();
        document.getElementById('status').innerText = 'Rendered: ' + productId;
        return canvas.toDataURL('image/webp', 0.92);
      } else {
        throw new Error('No renderer for ' + productId);
      }
    };
  </script>
</body>
</html>
